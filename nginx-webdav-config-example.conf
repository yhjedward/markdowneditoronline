# Nginx WebDAV 配置示例
# 如果您想使用直接连接模式，需要在 nginx 中添加这些配置

server {
    listen 443 ssl http2;
    server_name md.yhjedward.com;

    # SSL 证书配置（根据您的实际情况修改）
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    # WebDAV 路径配置
    location /markdowneditor/ {
        # 代理到后端 WebDAV 服务器
        proxy_pass http://1.32.228.66:8092/markdowneditor/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebDAV 需要的头
        proxy_set_header Destination $http_destination;
        proxy_set_header Depth $http_depth;
        proxy_set_header Overwrite $http_overwrite;

        # CORS 配置（如果需要直接连接模式）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PROPFIND, MKCOL, COPY, MOVE, OPTIONS, HEAD, LOCK, UNLOCK";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Destination, Overwrite, If-Modified-Since, If-None-Match, Range";
        add_header Access-Control-Allow-Credentials true;

        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PROPFIND, MKCOL, COPY, MOVE, OPTIONS, HEAD, LOCK, UNLOCK";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Destination, Overwrite, If-Modified-Since, If-None-Match, Range";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # 可选：如果也想使用代理服务器模式
    location /webdav/ {
        proxy_pass http://localhost:3000/webdav/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：如果也想提供前端页面
    location / {
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name md.yhjedward.com;
    return 301 https://$server_name$request_uri;
}
